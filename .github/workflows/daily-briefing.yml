name: Daily Briefing Feed

on:
  schedule:
    # 7:17 UTC = 3:17am US Eastern during EDT, 2:17am during EST.
    - cron: "17 7 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Build today's briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_and_build_feed.py

      - name: Commit and push updated feed
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add docs/feed.xml docs/items_store.json
          git diff --staged --quiet || git commit -m "Update daily briefing"
          git pull --rebase --autostash
          git push
